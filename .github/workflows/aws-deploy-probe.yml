name: Temporary AWS deployment capability probe

on:
  push:
    branches:
      - fix/intelligence-execution-evidence-20260920

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::643700104680:role/CentopusAmplifyGitHubDeployRole
          aws-region: us-east-1

      - name: Inspect non-secret deployment capabilities
        shell: bash
        run: |
          set +e
          echo "::group::identity"
          aws sts get-caller-identity
          echo "::endgroup::"

          echo "::group::control-stack"
          aws cloudformation describe-stacks --stack-name synthetic-beta-control             --query 'Stacks[0].{Name:StackName,Status:StackStatus,Outputs:Outputs}' --output json
          echo "cloudformation_status=$?"
          echo "::endgroup::"

          echo "::group::control-functions"
          aws lambda list-functions             --query 'Functions[?contains(FunctionName, `synthetic-beta`)].{Name:FunctionName,Arn:FunctionArn,Runtime:Runtime}'             --output json
          echo "lambda_list_status=$?"
          echo "::endgroup::"

          echo "::group::agent-assume"
          for role in synthetic-beta-agent-execution SyntheticBetaAgentExecutionRole; do
            echo "Checking $role"
            aws sts assume-role               --role-arn "arn:aws:iam::768669378827:role/$role"               --role-session-name github-deploy-probe               --duration-seconds 900               --query 'AssumedRoleUser.Arn' --output text
            echo "assume_status=$?"
          done
          echo "::endgroup::"
