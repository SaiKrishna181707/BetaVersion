name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    name: Node quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: npm security audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run check

  nova-worker:
    name: Nova worker SDK + contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/nova-worker/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r services/nova-worker/requirements.txt
      - run: python -m pip check
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - run: python -m pip_audit -r services/nova-worker/requirements.txt
      - run: python -m compileall services/nova-worker
      - name: Verify pinned AWS SDK surface
        run: |
          python - <<'PY'
          import inspect
          from bedrock_agentcore.tools.browser_client import BrowserClient
          from nova_act import GuardrailDecision, NovaAct, Workflow

          start = inspect.signature(BrowserClient.start)
          for parameter in ("identifier", "session_timeout_seconds"):
              if parameter not in start.parameters:
                  raise SystemExit(f"BrowserClient.start lacks {parameter}")
          for method in ("generate_ws_headers", "stop"):
              if not hasattr(BrowserClient, method):
                  raise SystemExit(f"BrowserClient lacks {method}")

          nova = inspect.signature(NovaAct)
          for parameter in (
              "cdp_endpoint_url",
              "cdp_headers",
              "starting_page",
              "workflow",
              "state_guardrail",
              "headless",
              "tty",
          ):
              if parameter not in nova.parameters:
                  raise SystemExit(f"NovaAct lacks {parameter}")

          assert GuardrailDecision.PASS is not None
          assert GuardrailDecision.BLOCK is not None
          assert Workflow is not None
          PY
      - run: python -m unittest discover -s services/nova-worker -p "test_*.py"
